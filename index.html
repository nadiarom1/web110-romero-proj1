
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bono | Coming Soon</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <img src="logo.svg" alt="Bono logo" class="logo">

      <div class="contact-info">
        <a href="mailto:contact@bono.com">✉ contact@bono.com</a>
        <a href="tel:+31218008244">☎ (+31) 021-800-8244</a>
        <a href="#" aria-label="Twitter">♥</a>
      </div>
    </header>

    <main class="main">
      <form class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" required></textarea>
        </div>

        <button type="submit">Submit</button>
      </form>

      <section class="content">
        <h1>Coming Soon For Every Developer</h1>
        <p>
          Our new Bono web app will change the way you think
          about content management and will allow you to focus
          on what's really important. Use the contact form to
          send us your thoughts.
        </p>
      </section>
    </main>
  </div>
</body>
</html>
